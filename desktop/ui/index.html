<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klikač</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <section class="fkey-row" id="fkeys"></section>

    <section class="grid-3">
      <div class="col-left">
        <article class="card col-card">
          <h2>Chování</h2>
          <div class="row-toggle">
            <span>Smyčka dokola</span>
            <label class="switch">
              <input type="checkbox" id="macro-loop">
              <span class="slider"></span>
            </label>
          </div>
          <div class="delay-block">
            <div class="delay-label">Rozsah náhodné prodlevy</div>
            <div class="delay-row">
              <label class="field range">
                <span>min <b id="dmin-val">200</b></span>
                <input type="range" id="delay-min" min="50" max="5000" step="1">
              </label>
              <label class="field range">
                <span>max <b id="dmax-val">800</b></span>
                <input type="range" id="delay-max" min="50" max="5000" step="1">
              </label>
            </div>
          </div>
          <button type="button" class="run-btn" id="macro-run" aria-pressed="false">
            <span class="run-dot"></span>
            <span class="run-label">Spustit makro</span>
          </button>
        </article>

        <article class="card mouse-card">
          <div class="row-toggle">
            <div>
              <div class="subhead">Přenos myši PC1 → PC2</div>
              <div class="muted tiny" id="mouse-meta">vypnuto</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="mouse-bridge">
              <span class="slider"></span>
            </label>
          </div>
        </article>
      </div>

      <div class="col-mid">
        <article class="card col-card">
          <h2>Sekvence</h2>
          <div id="slots" class="slots"></div>
        </article>
      </div>

      <div class="col-right">
        <div class="btn-row">
          <button type="button" class="pad-btn" data-cmd="LC">
            <span class="ico mouse"></span>
            <span>LMB</span>
          </button>
          <button type="button" class="pad-btn" data-cmd="RC">
            <span class="ico mouse"></span>
            <span>RMB</span>
          </button>
        </div>
        <button type="button" class="pad-btn wide" data-cmd="ENTER">
          <span class="ico key"></span>
          <span>ENTER</span>
        </button>

        <article class="card device-card">
          <h2>Destička</h2>
          <div class="status-line">
            <span class="dot" id="esp-dot"></span>
            <div>
              <div class="device-name" id="esp-status">MQTT: čekám…</div>
              <div class="mono" id="esp-ip">—</div>
              <div class="muted" id="esp-meta"></div>
              <div class="muted tiny" id="fw-meta">firmware —</div>
              <div class="muted tiny" id="broker-meta">broker —</div>
            </div>
          </div>
          <button type="button" class="fw-btn" id="flash-fw">Inicializovat přes USB</button>
          <div class="wifi-fold" id="wifi-fold">
            <button type="button" class="wifi-fold-btn" id="wifi-fold-btn" aria-expanded="false">
              <span id="wifi-fold-label">Wi-Fi pro USB init</span>
            </button>
            <div class="wifi-fold-body">
              <div class="wifi-fold-inner">
                <label class="field">
                  <span>Wi-Fi SSID</span>
                  <input type="text" id="wifi-ssid" maxlength="32" placeholder="název sítě">
                </label>
                <label class="field">
                  <span>Wi-Fi heslo</span>
                  <input type="password" id="wifi-pass" maxlength="64" placeholder="heslo sítě">
                </label>
              </div>
            </div>
          </div>
          <button type="button" class="fw-btn secondary" id="ota-fw">Aktualizovat firmware (Wi-Fi)</button>
          <div class="muted tiny" id="fw-log"></div>
        </article>

        <article class="card update-card">
          <div class="row-toggle">
            <div>
              <div class="subhead">Klikač <span id="app-ver"></span></div>
              <div class="muted tiny" id="upd-meta">kontrola verze…</div>
            </div>
            <button type="button" class="fw-btn compact" id="app-update" hidden>Aktualizovat</button>
          </div>
        </article>
      </div>
    </section>

    <article class="card log-card">
      <h2>Protokol</h2>
      <pre id="proto-log" class="proto-log"></pre>
    </article>

    <div class="toast" id="toast" hidden></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
