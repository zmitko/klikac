# Settings → Devices & services → Helpers → Create helper → Text
# Entity ID must be: input_text.esp32_macro_active
# (smaž nebo nech nepoužitý starý input_select.esp32_macro_active)
#
# Name: Aktivní makra
# Maximum length: 16
# Initial value: 1
#
# Příklady: 1    |    1,3    |    1,3,4
input_text:
  esp32_macro_active:
    name: Aktivní makra
    initial: "1"
    max: 16
