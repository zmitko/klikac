type: vertical-stack
cards:
  - type: entities
    title: Spuštění
    show_header_toggle: false
    entities:
      - entity: input_text.esp32_macro_active
        name: Aktivní makra (1,3,4)
        icon: mdi:numeric
      - entity: input_boolean.esp32_macro_loop
        name: Smyčka dokola
        icon: mdi:repeat
      - entity: input_number.esp32_delay_min
        name: D min
        icon: mdi:timer-sand
      - entity: input_number.esp32_delay_max
        name: D max
        icon: mdi:timer-sand-complete
      - entity: input_boolean.esp32_macro_run
        name: Makro běží
        icon: mdi:play-pause
        state_color: true

  - type: entities
    title: Myš
    show_header_toggle: false
    entities:
      - entity: input_button.esp32_mouse_left
        name: Levé
        icon: mdi:mouse-left-click
      - entity: input_button.esp32_mouse_right
        name: Pravé
        icon: mdi:mouse-right-click

  - type: entities
    title: Klávesnice
    show_header_toggle: false
    entities:
      - entity: input_button.esp32_enter
        name: Enter
        icon: mdi:keyboard-return

  - type: entities
    title: Uložené sekvence
    show_header_toggle: false
    entities:
      - entity: input_text.esp32_macro_1
        name: "1"
        icon: mdi:numeric-1
      - entity: input_text.esp32_macro_2
        name: "2"
        icon: mdi:numeric-2
      - entity: input_text.esp32_macro_3
        name: "3"
        icon: mdi:numeric-3
      - entity: input_text.esp32_macro_4
        name: "4"
        icon: mdi:numeric-4
      - entity: input_text.esp32_macro_5
        name: "5"
        icon: mdi:numeric-5

  - type: markdown
    content: "Aktivní makra `1` nebo `1,3,4` (běží paralelně), pak **Makro běží**. Tokeny: `F1`–`F8`, `ENTER`, `D` (jen RNG), `D5`/`D100` (vteřiny + RNG), `LC`/`LMB` = levé, `RC`/`RMB` = pravé."
