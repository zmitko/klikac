; ESP32-S3 N16R8 — USB HID keyboard + MQTT
; Flash via COM (CH343). HID appears on the USB port.

[env:esp32-s3-n16r8]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
upload_port = COM3
monitor_port = COM3

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
build_type = release

build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -I include

lib_deps =
    knolleary/PubSubClient@^2.8

; After one USB flash of firmware that includes ArduinoOTA:
;   pio run -e ota -t upload --upload-port <IP>
; IP is in HA as "ESP32 Keyboard IP" / MQTT topic esp32kbd/ip.
[env:ota]
extends = env:esp32-s3-n16r8
upload_protocol = espota
upload_port = esp32-keyboard.local
upload_flags =
    --auth=klikac-ota
